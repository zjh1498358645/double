name: Deploy free secret base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npx tsc --noEmit --incremental false
      - run: npm run build:cloudflare
      - name: Check deployment credential
        id: credential
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN to enable automatic backend updates. Current live website remains available."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/deploy-token.mjs
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply schema migrations
        if: steps.credential.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
      - name: Publish realtime rooms
        if: steps.credential.outputs.ready == 'true'
        run: npx wrangler deploy --config wrangler.realtime.jsonc
      - name: Publish Worker
        if: steps.credential.outputs.ready == 'true'
        run: npm run deploy:cloudflare

      - name: Publish Pages API
        if: steps.credential.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: e18dd6b4cca4ad434e6eccac45578318
        run: npm run deploy:pages-api
